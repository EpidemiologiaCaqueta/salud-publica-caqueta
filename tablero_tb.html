<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuberculosis · Caquetá</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --ink:#111b17; --ink2:#46524c; --muted:#86918b; --line:#e0e6e3; --grid:#eef2f0;
  --acc:#be123c; --acc2:#e11d48; --acc-soft:#fff1f2; --dark:#881337;
  --s1:#ffe4e6; --s2:#fda4af; --s3:#fb7185; --s4:#e11d48; --s5:#9f1239;
  --hg1:#4c0519; --hg2:#9f1239; --hg3:#e11d48; --hk:#fecdd3; --hc:#ffe4e6;
  --mujer:#e0633a; --hombre:#2a78d6; --alert:#c0392b; --alert-soft:#fdecea; --warn:#e08a1e;
}
body.def{
  --acc:#5b3f8c; --acc2:#7b5cb3; --acc-soft:#f0ebf8; --dark:#3a2560;
  --s1:#efe9f7; --s2:#d3c5ea; --s3:#ab93d3; --s4:#7d5db6; --s5:#4c3380;
  --hg1:#2c1b4d; --hg2:#5b3f8c; --hg3:#8a6bc4; --hk:#ddd0f2; --hc:#ece4f8;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
svg{display:block} svg text{font-family:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
/* encabezado */
header{background:linear-gradient(110deg,var(--hg1) 0%,var(--hg2) 55%,var(--hg3) 100%);color:#fff;display:flex;align-items:center;gap:18px;padding:10px max(20px,calc((100vw - 1640px)/2));position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-60px;top:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);pointer-events:none}
header .lg{height:84px;background:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header .tit{flex:1;min-width:0;text-align:center}
header .k{font-size:11px;letter-spacing:.2em;color:var(--hk);font-weight:700}
header h1{margin:2px 0 3px;font-size:28px;line-height:1.15;display:inline-flex;align-items:center;gap:10px}
header h1 svg{width:30px;height:30px;opacity:.95}
header .c{font-size:12px;color:var(--hc)} header .c b{color:#fff}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 12px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;white-space:nowrap;position:relative;z-index:1}
.hbtn:hover{background:rgba(255,255,255,.22)} .hbtn svg{width:16px;height:16px}
/* barra de páginas */
.nav{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px max(20px,calc((100vw - 1640px)/2));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.modo{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.modo button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:7px 13px;border-radius:8px;font:700 13px inherit;font-family:inherit;color:var(--ink2);cursor:pointer}
.modo button svg{width:17px;height:17px}
.modo button.on.n{background:#1f7a35;color:#fff;box-shadow:0 2px 6px rgba(31,122,53,.35)}
.modo button.on.d{background:#5b3f8c;color:#fff;box-shadow:0 2px 6px rgba(91,63,140,.35)}
.nav .tab{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:8px 12px;border-radius:8px;font:600 13px inherit;font-family:inherit;color:var(--ink2);cursor:pointer}
.nav .tab svg{width:16px;height:16px}
.nav .tab:hover{background:var(--acc-soft);color:var(--acc)}
.nav .tab.on{background:var(--acc-soft);color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.nav .sp{width:1px;height:26px;background:var(--line);margin:0 10px}
.seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;font:600 12px inherit;font-family:inherit;padding:6px 10px;border-radius:6px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.nav .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
/* cuerpo */
.body{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0;width:100%;max-width:1640px;margin:0 auto}
aside{background:var(--surface);border-right:1px solid var(--line);padding:12px 14px;overflow:auto}
aside h4{margin:2px 0 8px;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
aside h4 button{border:0;background:none;color:var(--acc);font:600 11.5px inherit;font-family:inherit;cursor:pointer;text-transform:none;letter-spacing:0}
.filtros label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.filtros select{display:block;margin-top:3px;font:12.5px inherit;font-family:inherit;height:31px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
.filtros select.act{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.nota{font-size:11px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.nota b{color:var(--ink2)}
main{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-height:0;padding:10px 14px 12px;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;border-radius:20px;padding:3px 6px 3px 10px;font-size:11.5px;font-weight:600}
.chip button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;width:17px;height:17px;cursor:pointer;font-size:12px;padding:0;line-height:1}
.chips .hint{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.chips .hint svg{width:14px;height:14px}
.page{display:none;min-height:0;height:100%;gap:10px}
.page.on{display:grid}
/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;min-height:0;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.card h3{margin:0 0 6px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--ink)}
.card h3 .ic{width:24px;height:24px;border-radius:7px;background:var(--acc-soft);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;flex:none}
.card h3 .ic svg{width:15px;height:15px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3 .tb{font-size:10.5px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:1px 6px;color:var(--muted);cursor:pointer}
.card h3 .fz{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px;border-radius:5px;display:inline-flex}
.card h3 .fz:hover{background:var(--acc-soft);color:var(--acc)}
.card h3 .fz svg{width:15px;height:15px}
.cb{flex:1;min-height:0;position:relative}
.cb>.fill{position:absolute;inset:0;overflow:hidden}
.cb>.fill:has(table){overflow:auto}
/* KPIs con icono */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:11px;align-items:center;min-width:0;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.kpi .ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--acc-soft);color:var(--acc)}
.kpi .ico svg{width:23px;height:23px}
.kpi .tx{min-width:0}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:23px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.kpi .v small{font-size:11.5px;font-weight:600;color:var(--muted)}
.kpi .s{font-size:10.5px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.main{background:linear-gradient(135deg,var(--hg1),var(--hg3));border:0;color:#fff}
.kpi.main .ico{background:rgba(255,255,255,.16);color:#fff} .kpi.main .l,.kpi.main .s{color:var(--hc)}
.kpi.main .s{white-space:normal;overflow:visible} .kpi.main .delta{background:rgba(255,255,255,.2);border-radius:5px;padding:0 5px;font-weight:700;color:#fff}
.kpi.alerta{border-color:#f3c4bf;background:linear-gradient(180deg,#fff,#fff6f5)}
.kpi.alerta .ico{background:var(--alert-soft);color:var(--alert)} .kpi.alerta .v{color:var(--alert)}
/* fichas con icono */
.tiles{display:grid;gap:8px;height:100%;grid-auto-rows:minmax(0,1fr)}
.tile{border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:border-color .12s,background .12s;min-width:0;overflow:hidden}
.tile:hover{border-color:var(--acc2);background:#fafcfb}
.tile.sel{border-color:var(--acc);background:var(--acc-soft)}
.tile.dim{opacity:.4}
.tile .ti{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.tile .ti svg{width:21px;height:21px}
.tile .tv{font-size:clamp(16px,2.1vh,25px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .tl{font-size:11.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tp{font-size:11px;color:var(--muted)}
.tile .bar{height:4px;border-radius:2px;background:var(--grid);margin-top:4px;overflow:hidden}
.tile .bar i{display:block;height:100%;border-radius:2px}
.tiles.xl .tile{padding:10px 16px;gap:16px}.tiles.xl .ti{width:50px;height:50px;border-radius:14px}.tiles.xl .ti svg{width:28px;height:28px}
.tiles.xl .tl{font-size:13.5px}.tiles.xl .tv{font-size:32px}.tiles.xl .tp{font-size:14px;font-weight:600}.tiles.xl .bar{height:8px;border-radius:4px;margin-top:8px}
.tiles.xxl .tile{padding:14px 20px;gap:20px}.tiles.xxl .ti{width:64px;height:64px;border-radius:18px}.tiles.xxl .ti svg{width:36px;height:36px}
.tiles.xxl .tl{font-size:15px}.tiles.xxl .tv{font-size:42px}.tiles.xxl .tp{font-size:16px;font-weight:600}.tiles.xxl .bar{height:10px;border-radius:5px;margin-top:10px}
/* bloque de indicador grande */
.big{display:flex;flex-direction:column;justify-content:center;gap:4px;height:100%;padding:4px 2px}
.big .bv{font-size:clamp(28px,4.4vh,46px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--alert)}
.big .bl{font-size:12px;color:var(--ink2);font-weight:600}
.big .bs{font-size:11px;color:var(--muted);line-height:1.4}
/* varios */
.click{cursor:pointer} .click:hover .m{filter:brightness(.9)}
.mun{cursor:pointer} .mun:hover{stroke:#111b17;stroke-width:2.2}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink2);align-items:center;margin-top:4px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:12px}
.pplk{display:flex;flex-direction:column;height:100%;justify-content:space-between}.pk{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:8px;padding:4px 0;border-bottom:1px solid #f1e6e9}.pk .pl{font-size:11.5px;color:var(--ink)}.pk b{font-size:17px;font-variant-numeric:tabular-nums;grid-row:span 2;text-align:right}.pk small{font-size:10px;color:var(--muted)}
.ind{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:0 14px;height:calc(100% - 18px)}
.ir{display:grid;grid-template-columns:minmax(0,1fr) auto 54px;align-items:center;gap:8px;border-bottom:1px solid #f1e6e9;min-height:0}
.in{min-width:0;line-height:1.15}.in span{display:block;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir b{font-size:13px;color:#4c0519;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{height:7px;border-radius:4px;background:#f3e4e8;overflow:hidden}.ib i{display:block;height:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--grid);text-align:left}
th{position:sticky;top:0;background:#f7f9f8;color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;z-index:1;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click:hover td{background:var(--acc-soft)}
#tip{position:fixed;pointer-events:none;background:#111b17;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.45;opacity:0;transition:opacity .08s;z-index:40;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#tip small{color:#bfc9c4}
.vacio{color:var(--muted);font-size:12px;padding:24px 0;text-align:center}
.pie{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.btnf,.velo{display:none}
html:fullscreen{background:var(--bg)}
/* páginas */
#p1{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto minmax(0,1.12fr) minmax(0,1fr)}
#p1 .kpis{grid-column:1/-1}
#p2,#p3,#p4,#p5{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.page.foco{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}
.page.foco>*{display:none!important}
.page.foco>.card.focus{display:flex!important;grid-column:1/-1!important;grid-row:1/-1!important}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
@media(max-width:1200px){.kpi{padding:8px 11px;gap:8px}.kpi .ico{display:none}.kpi .v{font-size:21px}.nav .tab span{display:none}}
@media(max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){
  .app{height:auto} .body{grid-template-columns:1fr}
  aside{position:fixed;top:0;left:0;bottom:0;width:290px;z-index:30;transform:translateX(-105%);transition:transform .2s}
  body.menu aside{transform:none} body.menu .velo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .btnf{display:inline-flex}
  .page.on{display:flex;flex-direction:column;height:auto} .page .card{min-height:330px}
  header .lg:first-of-type{display:none} header h1{font-size:19px}
  main{min-width:0;overflow-x:hidden} header{flex-wrap:wrap}
}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))} header .lg{display:none} .nav .tab span,.modo button span{display:none}}
</style>
<style>html.enportal header .lgv{display:none}</style><script>try{if(window.self!==window.top)document.documentElement.classList.add('enportal')}catch(e){document.documentElement.classList.add('enportal')}</script>
</head>

function condiciones(p,s,excepto){
  const c=D[p],conds=[];
  for(const [k,v] of Object.entries(s)){
    if(v==null||k===excepto)continue;
    if(!c.dims.includes(k))continue;
    if(v===SIN6){const i=c.dic[k].indexOf("Descartado");conds.push([c.dims.indexOf(k),c.dic[k].map((_,j)=>j).filter(j=>j!==i)]);continue;}
    conds.push([c.dims.indexOf(k),[].concat(v).map(x=>c.dic[k].indexOf(x))]);
  }
  return conds;
}
function filasCon(p,s,excepto){const conds=condiciones(p,s,excepto);return D[p].rows.filter(r=>conds.every(([i,vs])=>vs.includes(r[i])));}

function agrupa2(rows,d1,d2){const c=D[actual],i=c.dims.indexOf(d1),j=c.dims.indexOf(d2),m=new Map();for(const r of rows){const a=c.dic[d1][r[i]],b=c.dic[d2][r[j]];if(!m.has(a))m.set(a,new Map());const mm=m.get(a);mm.set(b,(mm.get(b)||0)+r[r.length-1]);}return m;}
const total=rows=>rows.reduce((a,r)=>a+r[r.length-1],0);
const cuentaP=(p,rows,dim,vals)=>{const m=agrupaP(p,rows,dim);return [].concat(vals).reduce((a,k)=>a+(m.get(k)||0),0);};

const etqF=(f,v)=>v===SIN6?"Todos sin descartados":f==="Periodo"?`Periodo ${+v}`:etq(f,v);
function pintarFiltros(){
  const c=D[actual],box=document.getElementById("filtros");box.innerHTML="";
  for(const f of CONF[actual].filtros){
    const pres=agrupa(filas(f),f);let ops=c.dic[f].filter(v=>pres.has(v)||S()[f]===v);
    ops=ordenar(f,ops.map(v=>[v,pres.get(v)||0])).map(e=>e[0]);
    if(f==="Mpio procedencia"||f==="Mpio residencia")ops.sort((a,b)=>a.localeCompare(b));
    const lab=document.createElement("label");
    lab.innerHTML=`${esc(nombreDim(f))}<select class="${hay(f)?"act":""}"><option value="">Todos</option>${f==="Ajuste"?`<option value="${SIN6}" ${S()[f]===SIN6?"selected":""}>Todos sin descartados</option>`:""}${ops.map(v=>`<option ${S()[f]===v?"selected":""} value="${esc(v)}">${esc(corto(etqF(f,v),40))} (${fmt(pres.get(v)||0)})</option>`).join("")}</select>`;
    lab.querySelector("select").onchange=e=>{S()[f]=e.target.value||null;pintarFiltros();render();};box.appendChild(lab);
  }
  const ch=Object.entries(S()).filter(([k,v])=>v!=null&&v!==SIN6);

function tarjeta(page,cls,icon,tit,opts={}){

  c.querySelector(".fz").onclick=()=>{FOCO=FOCO===key?null:key;render();};
  if(opts.tabla)c.querySelector(".tb").onclick=()=>{TABLA[actual+opts.tabla]=!TABLA[actual+opts.tabla];render();};
  page.appendChild(c);
  const f=c.querySelector(".fill");return {el:c,body:f,sub:c.querySelector(".sub"),W:Math.max(200,f.clientWidth),H:Math.max(110,f.clientHeight),tabla:opts.tabla?!!TABLA[actual+opts.tabla]:false};

function tablaHTML(e,dim,sum,col="Casos"){

}
/* barras horizontales (ajustadas a la altura de la tarjeta) */
function hbar(T,e,dim,o={}){
  const sum=o.sum||e.reduce((a,x)=>a+x[1],0),W=T.W-2;if(!sum)return `<div class="vacio">Sin datos para los filtros</div>`;
  const cab=Math.max(1,Math.floor((T.H-2)/22));
  if(e.length>cab){if(T.sub&&!T.sub.textContent.includes("top"))T.sub.textContent+=` · top ${cab} de ${e.length}`;e=e.slice(0,cab);}
  const rh=Math.max(22,(T.H-2)/e.length),bh=Math.min(36,Math.max(14,rh*.6)),fs=rh>56?14.5:rh>30?12.5:11.5;
  const lw=Math.min(o.lw||190,Math.round(W*.46)),H=e.length*rh,max=Math.max(1,...e.map(x=>x[1])),bw=W-lw-(o.fv?70:84),col=o.col||"var(--acc2)";
  let s=`<svg width="${W}" height="${H}">`;
  e.forEach(([k,v,extra],i)=>{const y=i*rh,w=Math.max(2,bw*v/max),d0=hay(dim)&&!sel(dim,k),lab=o.lab?o.lab(k):etq(dim,k);
    const tt=o.tip?o.tip(k,v,extra):`${esc(etq(dim,k))}<br><b>${fmt(v)}</b> <small>· ${pct(v,sum)}</small>`;
    const c=typeof col==="function"?col(k,i,extra):col;

    ["Más de 30 días entre síntomas y consulta",pct(c("Días síntomas a consulta",["31-60 días","61-90 días","Más de 90 días"]),N-c("Días síntomas a consulta","Sin dato")),`mediana departamental: ${D.dias_med!=null?fmt(D.dias_med)+" días":"–"}`,null]];
  const bar=p=>p==null?"":`<div class="ib"><i style="width:${(100*p).toFixed(0)}%;background:${p>=.9?"#16a34a":p>=.7?"#f59e0b":"#be123c"}"></i></div>`;
  return `<div class="ind">${I.map(([n,v,cal,p])=>`<div class="ir" title="${esc(n)}: ${esc(cal)}"><div class="in"><span>${n}</span><small>${cal}</small></div><b>${v}</b>${bar(p)}</div>`).join("")}</div><div class="pie">Barra = cobertura: verde ≥ 90 %, ámbar 70–89 %, rojo &lt; 70 %. Calculado con los filtros aplicados.</div>`;
}

/* ---------------- render ---------------- */
const COM=[["Diabetes","Diabetes","#be123c"],["Desnutrición","Desnutrición","#e11d48"],["Enfermedad renal","Enfermedad renal","#9f1239"],["EPOC","EPOC","#f43f5e"],["Enfermedad hepática","Enfermedad hepática","#fb7185"],["Cáncer","Cáncer","#881337"],["Artritis reumatoide","Artritis reumatoide","#fda4af"],["Silicosis","Silicosis","#fecdd3"]];
const POBV=[["PPL","Privados de la libertad (PPL)","#7c2d12"],["Indígena","Indígenas","#b5651d"],["Migrante","Migrantes","#0f8f86"],["Desplazado","Desplazados","#6b4f9e"],["Discapacidad","Con discapacidad","#1f63c6"],["Gestante","Gestantes","#c2408f"],["Trabajador de salud","Trabajadores de salud","#16a34a"],["Víctima de violencia armada","Víctimas de violencia armada","#9f1239"],["Población ICBF","Población ICBF","#0369a1"],["Desmovilizado","Desmovilizados","#57534e"],["Centro psiquiátrico","Centro psiquiátrico","#a16207"],["Madre comunitaria","Madres comunitarias","#db2777"]];
function render(){
  document.querySelectorAll(".page").forEach(p=>{p.classList.toggle("on",p.id===PAG);p.innerHTML="";});
  const page=document.getElementById(PAG);
  if(FOCO&&!FOCO.startsWith(actual+PAG+"|"))FOCO=null;
  page.classList.toggle("foco",!!FOCO);
  const ok=(T,fn)=>{try{const r=fn();if(typeof r==="string")T.body.innerHTML=r;}catch(e){T.body.innerHTML=`<div class="vacio">Error: ${esc(e.message)}</div>`;console.error(e);}};
  const U=UBI[actual]==="res"?"procedencia":"residencia";
  const TIPO=[["Pulmonar","Pulmonar","pulmon","#be123c"],["Extrapulmonar","Extrapulmonar","persona","#7c3aed"]];
  const mapaCard=(cls)=>{const segM=`<span class="seg">${[["color","Colores"],["casos","Casos"],["tasa","Tasa"]].map(([u,t])=>`<button data-m="${u}" class="${MODO===u?"on":""}">${t}</button>`).join("")}</span>`;
    const T=tarjeta(page,cls,"mapa","Casos por municipio",{extra:segM,tabla:"map",key:"mapa"});T.sub.textContent=`· ${U}`;
    T.el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{MODO=b.dataset.m;render();});
    ok(T,()=>{const d=dimMun();return T.tabla?tablaHTML(ent(d),d):mapa(T,d);});};
  if(PAG==="p1"){
    kpis(page);
    let T=tarjeta(page,"c6","calendario","Casos notificados por semana epidemiológica",{tabla:"sem"});T.sub.textContent=`· ${D.anio}pr* · serie por año al cargar la base histórica`;
    ok(T,()=>semanas(T));
    T=tarjeta(page,"c3","personas","Distribución por sexo");T.sub.textContent="· casos confirmados";
    ok(T,()=>fichas(T,"Sexo",[["Hombre","Hombres","persona","#0B3C8C"],["Mujer","Mujeres","persona","#c2408f"]]));
    T=tarjeta(page,"c3","pulmon","Tipo de tuberculosis");T.sub.textContent="· pulmonar vs extrapulmonar";
    ok(T,()=>fichas(T,"Tipo de TB",TIPO));
    T=tarjeta(page,"c5","piramide","Grupos de edad",{tabla:"edad"});T.sub.textContent="· distribución etaria";
    ok(T,()=>{const e=ent("Grupo de edad");return T.tabla?tablaHTML(e,"Grupo de edad"):cols(T,e,"Grupo de edad",{col:"var(--acc2)"});});
    T=tarjeta(page,"c3","reloj","Clasificación de caso");T.sub.textContent="· nuevos vs previamente tratados";
    ok(T,()=>fichas(T,"Antecedente",[["Nuevo","Caso nuevo","persona","#0B3C8C"],["Previamente tratado","Previamente tratado","reloj","#e0633a"]]));
    T=tarjeta(page,"c4","reloj","Previamente tratados: motivo de reingreso");
    ok(T,()=>{const e=ent("Previamente tratado").filter(x=>x[0]!=="No aplica");return e.length?hbar(T,e,"Previamente tratado",{lw:190,col:"#e0633a"}):`<div class="vacio">Sin casos previamente tratados</div>`;});
  }
  if(PAG==="p2"){
    let T=tarjeta(page,"c3","escudo","Coinfección TB/VIH");T.sub.textContent="· estado VIH en casos de TB";
    ok(T,()=>fichas(T,"VIH",[[SI,"VIH positivo","alerta","#be123c"],["No","VIH negativo","escudo","#16a34a"],["Desconocido","Estado desconocido","pregunta","#86918b"]],{ocultarCeros:true}));
    T=tarjeta(page,"c5","corazon","Comorbilidades");T.sub.textContent="· diabetes, desnutrición y otras · % de casos";
    ok(T,()=>barrasSi(T,COM,{lw:150,ocultarCeros:true}));
    T=tarjeta(page,"c4","escudo","Régimen de aseguramiento");T.sub.textContent="· distribución por afiliación";
    ok(T,()=>hbar(T,ent("Régimen"),"Régimen",{lw:100}));
    T=tarjeta(page,"c3","personas","Grupo étnico");T.sub.textContent="· pertenencia étnica declarada";
    ok(T,()=>fichas(T,"Grupo étnico",[["Indígena","Indígena","personas","#b5651d"],["Negro, mulato, afrocolombiano","Afrocolombiano","personas","#57534e"],["ROM (gitano)","ROM (gitano)","personas","#7c3aed"],["Raizal","Raizal","personas","#0369a1"],["Palenquero","Palenquero","personas","#a16207"],["Otros","Otros / ninguno","persona","#86918b"]],{ocultarCeros:true}));
    T=tarjeta(page,"c6","personas","Poblaciones vulnerables");T.sub.textContent="· % de casos · clic para filtrar";
    ok(T,()=>barrasSi(T,POBV,{lw:180,ocultarCeros:true}));
    T=tarjeta(page,"c3","arbol","Área de residencia");
    ok(T,()=>fichas(T,"Área",[["Cabecera municipal","Cabecera municipal","casa","#0B3C8C"],["Centro poblado","Centro poblado","pueblo","#1f63c6"],["Rural disperso","Rural disperso","arbol","#178a4a"]]));
  }
  if(PAG==="p3"){
    let T=tarjeta(page,"c8","tabla","Indicadores del protocolo");T.sub.textContent="· vigilancia y control de TB · con los filtros aplicados";
    ok(T,()=>indicadores(T));
    T=tarjeta(page,"c4","check","Confirmación bacteriológica en TB pulmonar");
    ok(T,()=>{const pul=filas().filter(r=>D.tb.dic["Tipo de TB"][r[D.tb.dims.indexOf("Tipo de TB")]]==="Pulmonar"),n=total(pul),c=cuenta(pul,"Confirmación bacteriológica",SI);
      return anillo(T,c,n,"De los casos pulmonares tienen al menos una prueba positiva",`${fmt(c)} de ${fmt(n)} casos pulmonares con baciloscopia, cultivo o prueba molecular positiva.`,["Confirmación bacteriológica",SI]);});
    T=tarjeta(page,"c6","reloj","Tiempo entre inicio de síntomas y consulta",{tabla:"dias"});T.sub.textContent=`· mediana ${D.dias_med!=null?fmt(D.dias_med)+" días":"–"}`;
    ok(T,()=>{const e=ent("Días síntomas a consulta");return T.tabla?tablaHTML(e,"Días síntomas a consulta"):cols(T,e,"Días síntomas a consulta",{col:k=>({"0-15 días":"#16a34a","16-30 días":"#84cc16","31-60 días":"#f59e0b","61-90 días":"#ea580c","Más de 90 días":"#be123c"}[k]||"#cbd5e1")});});
    T=tarjeta(page,"c3","lupa","Ayudas para configurar el caso");T.sub.textContent="· % de casos";
    ok(T,()=>barrasSi(T,[["Cuadro clínico","Cuadro clínico","#0B3C8C"],["Radiológico","Radiología","#1f63c6"],["Nexo epidemiológico","Nexo epidemiológico","#6b4f9e"]],{lw:145}));
    T=tarjeta(page,"c3","balanza","Estado nutricional (IMC)",{tabla:"imc"});
    ok(T,()=>{const e=ent("Estado nutricional");return T.tabla?tablaHTML(e,"Estado nutricional"):cols(T,e,"Estado nutricional",{col:k=>({"Bajo peso (<18,5)":"#be123c","Normal (18,5-24,9)":"#16a34a","Sobrepeso (25-29,9)":"#f59e0b","Obesidad (≥30)":"#ea580c"}[k]||"#cbd5e1"),lab:k=>k.split(" (")[0]});});
  }
  if(PAG==="p4"){
    let T=tarjeta(page,"c6","microscopio","Diagnóstico bacteriológico");T.sub.textContent="· resultado BK, cultivo, GeneXpert, histopatología y PSF";
    ok(T,()=>cascada(T,[["Baciloscopia","Baciloscopia (BK)"],["Cultivo","Cultivo"],["Prueba molecular","Prueba molecular"],["Histopatología","Histopatología"],["PSF","Sensibilidad (PSF)"]]));
    T=tarjeta(page,"c3","hospital","Condición final");T.sub.textContent="· estado vital al notificar";
    ok(T,()=>fichas(T,"Condición final",[["Vivo","Vivo","persona","#16a34a"],["Fallecido","Fallecido","cruz","#be123c"]]));
    T=tarjeta(page,"c3","pastilla","Farmacorresistencia");T.sub.textContent="· resistente vs sensible";
    ok(T,()=>fichas(T,"Condición",[["Sensible","Sensible","escudo","#16a34a"],["Farmacorresistente","Resistente","alerta","#be123c"]]));
    T=tarjeta(page,"c4","alerta","Clasificación de resistencia");T.sub.textContent="· tipo de resistencia del caso";
    ok(T,()=>{const e=ent("Tipo de resistencia").filter(x=>x[0]!=="No aplica");return e.length?hbar(T,e,"Tipo de resistencia",{lw:150,col:"#be123c"}):`<div class="vacio">Sin casos farmacorresistentes</div>`;});
    const cR=k=>({"Positivo":"#be123c","Negativo":"#94a3b8","En proceso":"#f59e0b","Sin resultado":"#cbd5e1","No realizada":"#e2dadd"}[k]||"#cbd5e1");
    T=tarjeta(page,"c4","microscopio","Resultado baciloscopia",{tabla:"bk"});T.sub.textContent="· BK de ingreso";
    ok(T,()=>{const e=ent("Baciloscopia");return T.tabla?tablaHTML(e,"Baciloscopia"):cols(T,e,"Baciloscopia",{col:cR});});
    T=tarjeta(page,"c4","microscopio","Prueba molecular",{tabla:"pm"});T.sub.textContent="· realización y resultado (GeneXpert / LAMP)";
    ok(T,()=>{const e=ent("Prueba molecular");return T.tabla?tablaHTML(e,"Prueba molecular"):cols(T,e,"Prueba molecular",{col:cR});});
  }
  if(PAG==="p5"){
    mapaCard("c4");
    let T=tarjeta(page,"c4","bandera","Casos e incidencia por municipio");T.sub.textContent=`· tasa ×100.000 hab. · DANE`;
    ok(T,()=>{const d=dimMun(),e=ent(d).filter(x=>esCaq(x[0])).map(([k,v])=>[k,v,POB[k]?100000*v/POB[k]:0]);
      return hbar(T,e,d,{lw:130,col:k=>COL_MUN[k]||"#9aa5a0",fv:(v,t)=>`${fmt(v)}<tspan fill="#86918b" font-weight="400" font-size="10.5"> · ${fmt1(t)}</tspan>`,tip:(k,v,t)=>`<b>${esc(capT(k))}</b><br>${fmt(v)} casos<br>Tasa: <b>${fmt1(t)}</b> ×100.000 hab.`});});
    T=tarjeta(page,"c4","hospital","Top UPGD notificadoras",{tabla:"upgd"});T.sub.textContent="· primeras 15";
    ok(T,()=>{const e=ent("UPGD");return T.tabla?tablaHTML(e,"UPGD"):hbar(T,e.slice(0,15),"UPGD",{lw:200,lab:k=>capT(k)});});
    T=tarjeta(page,"c3","candado","Población privada de la libertad");T.sub.textContent="· KPIs PPL";
    ok(T,()=>pplKpis(T));
    T=tarjeta(page,"c5","candado","Casos PPL vs No PPL por periodo");T.sub.textContent=`· ${D.anio}pr*`;
    ok(T,()=>pplPeriodo(T,false));
    T=tarjeta(page,"c4","candado","Casos PPL por periodo epidemiológico");
    ok(T,()=>pplPeriodo(T,true));
  }
  page.querySelectorAll("[data-f]").forEach(el=>el.addEventListener("click",ev=>{ev.stopPropagation();toggle(el.dataset.f,el.dataset.v);}));
  document.querySelectorAll(".kpis [data-f]").forEach(el=>el.onclick=ev=>{ev.stopPropagation();toggle(el.dataset.f,el.dataset.v);});
}

/* ---------------- arranque ---------------- */
document.getElementById("subt").innerHTML=`Sivigila · ReporteExpertos evento 813 · Año <b>${D.anio}pr*</b> · Datos a la <b>SE ${D.se}</b> (${D.se_fechas}) · Sujetos a depuración`;
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const g=e.target.closest&&e.target.closest("[data-tip]");if(!g){tip.style.opacity=0;return;}tip.innerHTML=g.getAttribute("data-tip");tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+"px";});
addEventListener("keydown",e=>{if(e.key==="Escape"&&FOCO){FOCO=null;render();}});
let _rt;addEventListener("resize",()=>{clearTimeout(_rt);_rt=setTimeout(render,150);});
function botonAmpliar(){const fs=!!document.fullscreenElement;document.getElementById("ampliar").innerHTML=fs?`${ico("reducir")}<span>Salir</span>`:`${ico("ampliar")}<span>Ampliar</span>`;}
function nuevaPestana(){try{const u=URL.createObjectURL(new Blob(["<!DOCTYPE html>"+document.documentElement.outerHTML],{type:"text/html"}));if(!window.open(u,"_blank"))alert("Permita las ventanas emergentes para ampliar el tablero.");}catch(e){}}
function ampliar(){if(document.fullscreenElement){document.exitFullscreen();return;}const el=document.documentElement;if(el.requestFullscreen&&document.fullscreenEnabled!==false)el.requestFullscreen().catch(nuevaPestana);else nuevaPestana();}
document.addEventListener("fullscreenchange",()=>{botonAmpliar();setTimeout(render,150);});
botonAmpliar();modo();
</script>
</body>
</html>
