<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georreferenciación EISP · Caquetá</title>
<style>
:root{
  --bg:#eef2f7; --surface:#fff; --ink:#0f1b2d; --ink2:#44526a; --muted:#8592a8; --line:#e1e7ef; --grid:#eef2f7;
  --acc:#0b3c8c; --acc2:#1f63c6; --acc-soft:#e8f0fc;
  --night:#0a1324; --night2:#101d35; --night3:#1a2a48; --glow:#38bdf8;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
svg{display:block} svg text{font-family:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* encabezado compacto */
header{background:linear-gradient(105deg,#06204f 0%,#0b3c8c 50%,#1f63c6 100%);color:#fff;display:flex;align-items:center;gap:14px;padding:7px 16px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-40px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.22),transparent 70%);pointer-events:none}
header .lg{height:52px;background:#fff;border-radius:10px;padding:4px 9px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header .tit{flex:1;min-width:0;text-align:center}
header .k{font-size:10px;letter-spacing:.2em;color:#a9c8f5;font-weight:700}
header h1{margin:1px 0 1px;font-size:21px;line-height:1.15;display:inline-flex;align-items:center;gap:9px}
header h1 svg{width:24px;height:24px;color:#7dd3fc}
header .c{font-size:11.5px;color:#cfe0fb} header .c b{color:#fff}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 11px;font:600 12px inherit;font-family:inherit;cursor:pointer;white-space:nowrap;position:relative;z-index:1}
.hbtn:hover{background:rgba(255,255,255,.22)} .hbtn svg{width:15px;height:15px}
/* cuerpo */
.body{display:grid;grid-template-columns:228px minmax(0,1fr) 340px;min-height:0;gap:10px;padding:10px}
aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow:auto;min-height:0}
aside h4{margin:0 0 7px;font-size:10.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
aside h4 button{border:0;background:none;color:var(--acc2);font:600 11.5px inherit;font-family:inherit;cursor:pointer;text-transform:none;letter-spacing:0}
.filtros label{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.filtros select{display:block;margin-top:2px;font:12px inherit;font-family:inherit;height:29px;padding:0 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
.filtros select.act{border-color:var(--acc2);background:var(--acc-soft);color:var(--acc);font-weight:600}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nota{font-size:10.5px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.nota b{color:var(--ink2)}
.ayuda{color:var(--acc2);font-weight:600;cursor:help;display:inline-block;margin-bottom:4px}
.centro{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-height:0;min-width:0}
.der{display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.62fr);gap:10px;min-height:0}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 10px;display:flex;gap:9px;align-items:center;min-width:0}
.kpi .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--acc-soft);color:var(--acc2)}
.kpi .ico svg{width:19px;height:19px}
.kpi .tx{min-width:0}
.kpi .l{font-size:10.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11px;font-weight:600;color:var(--muted)}
.kpi .s{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.main{background:linear-gradient(135deg,#06204f,#1f63c6);border:0;color:#fff}
.kpi.main .ico{background:rgba(255,255,255,.15);color:#7dd3fc}.kpi.main .l,.kpi.main .s{color:#cfe0fb}
.kpi.rojo .ico{background:#fdecee;color:#e11d48}.kpi.rojo .v{color:#e11d48}
/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;min-height:0;display:flex;flex-direction:column}
.card h3{margin:0 0 5px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.card h3 .ic{width:23px;height:23px;border-radius:7px;background:var(--acc-soft);color:var(--acc2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.card h3 .ic svg{width:14px;height:14px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:10.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fz{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px;border-radius:5px;display:inline-flex}
.fz:hover{background:var(--acc-soft);color:var(--acc2)} .fz svg{width:15px;height:15px}
.cb{flex:1;min-height:0;position:relative}.cb>.fill{position:absolute;inset:0;overflow:hidden}
/* tarjeta del mapa (modo noche) */
.mapcard{background:radial-gradient(ellipse at 50% 40%,#fbfcfe 0%,#f1f5fa 80%);border:1px solid #dbe4f0;border-radius:14px;position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(15,40,80,.08)}
.mapbar{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap;position:relative;z-index:3;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,0))}
.mapbar .t{color:#0f1b2d;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:7px;margin-right:4px}
.mapbar .t svg{width:16px;height:16px;color:#1f63c6}
.mapbar .sp{flex:1}
.dseg{display:inline-flex;background:#eef2f8;border:1px solid #e1e7ef;border-radius:9px;padding:2px}
.dseg button{border:0;background:transparent;font:600 11.5px inherit;font-family:inherit;padding:5px 8px;border-radius:7px;color:#44526a;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.dseg button svg{width:13px;height:13px}
.dseg button.on{background:linear-gradient(135deg,#1f63c6,#0ea5e9);color:#fff;box-shadow:0 2px 10px rgba(14,165,233,.35)}
.dlab{font-size:10px;color:#8592a8;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mapa{flex:1;min-height:0;position:relative;cursor:grab;touch-action:none}
.mapa.drag{cursor:grabbing}
.mapa svg{position:absolute;inset:0;width:100%;height:100%}
.mun{transition:fill-opacity .15s}
.mun:hover{fill:#cdd8e6;stroke:#1f63c6;stroke-width:1.8}
.zoom{position:absolute;right:10px;bottom:46px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoom button{width:32px;height:32px;border-radius:9px;border:1px solid #dbe4f0;background:rgba(255,255,255,.92);color:#0b3c8c;box-shadow:0 2px 6px rgba(15,40,80,.1);cursor:pointer;font:700 16px inherit;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.zoom button:hover{background:#1f63c6;color:#fff}.zoom button svg{width:15px;height:15px}
.leyenda{position:absolute;left:10px;bottom:10px;z-index:3;background:rgba(255,255,255,.92);border:1px solid #e1e7ef;border-radius:10px;padding:7px 10px;color:#44526a;box-shadow:0 2px 8px rgba(15,40,80,.08);font-size:11px;max-width:62%;backdrop-filter:blur(4px)}
.leyenda .fl{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.leyenda .gr{height:9px;border-radius:5px;width:180px;margin:3px 0}
.leyenda .nt{color:#8592a8;font-size:10px;margin-top:3px}
.escala{position:absolute;right:52px;bottom:14px;z-index:3;color:#64748b;font-size:10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.escala span{display:block;height:4px;border:1px solid #64748b;border-top:0}
.norte{position:absolute;right:14px;top:54px;z-index:2;color:#64748b;font:700 10px inherit;text-align:center;opacity:.8}
.norte svg{width:22px;height:22px;margin:0 auto}
.chips{position:absolute;left:10px;top:50px;z-index:3;display:flex;gap:5px;flex-wrap:wrap;max-width:70%}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(31,99,198,.85);color:#fff;border-radius:20px;padding:3px 5px 3px 9px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}
.chip button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;width:16px;height:16px;cursor:pointer;font-size:11px;padding:0;line-height:1}
/* listas */
.lst{display:flex;flex-direction:column;height:100%}
.row{display:flex;align-items:center;gap:8px;padding:0 4px;border-radius:7px;cursor:pointer;flex:1 1 0;min-height:0;max-height:40px}
.row:hover{background:var(--acc-soft)}
.row.sel{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc2)}
.row.dim{opacity:.38}
.row .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.row .nm{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row .br{width:70px;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;flex:none}
.row .br i{display:block;height:100%;border-radius:3px}
.row .vl{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.row .v2{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.lhead{display:flex;gap:8px;padding:0 4px 3px;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--grid);margin-bottom:2px}
.click{cursor:pointer}
#tip{position:fixed;pointer-events:none;background:#0f1b2d;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.45;opacity:0;transition:opacity .08s;z-index:60;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.3);border:1px solid rgba(125,211,252,.25)}
#tip small{color:#a9b8d3}
.vacio{color:var(--muted);font-size:12px;padding:18px 0;text-align:center}
/* foco (ampliar una visualización) */
.body.foco{grid-template-columns:minmax(0,1fr)}
.body.foco>aside{display:none}
.body.foco .centro,.body.foco .der{grid-column:1/-1;grid-row:1}
.body.foco .centro:not(.tiene),.body.foco .der:not(.tiene){display:none}
.body.foco .tiene{grid-template-rows:minmax(0,1fr)!important}
.body.foco .tiene>*:not(.focus){display:none!important}
.btnf,.velo{display:none}
html:fullscreen{background:var(--bg)}
@media(max-width:1400px){.kpi .ico{display:none}}
@media(max-width:1750px){.mapbar .dlab{display:none}.mapbar .t{font-size:0;gap:0}.mapbar .t svg{width:18px;height:18px}}
@media(max-width:1250px){.body{grid-template-columns:210px minmax(0,1fr) 290px}.mapbar .dlab{display:none}}
@media(max-width:1000px){
  body{overflow:auto}.app{height:auto}.body{grid-template-columns:1fr}
  aside{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:30;transform:translateX(-105%);transition:transform .2s;border-radius:0}
  body.menu aside{transform:none} body.menu .velo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .btnf{display:inline-flex}.mapcard{height:72vh}.der{grid-template-rows:none}.der .card{height:330px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} header .lg{display:none} header h1{font-size:17px}
}
</style>

  if(e.length>cab)e=e.slice(0,cab);
  box.innerHTML=`<div class="lst"><div class="lhead"><span style="width:11px"></span><span style="flex:1">${o.h1}</span><span style="width:70px"></span><span style="min-width:38px;text-align:right">Casos</span><span style="min-width:46px;text-align:right">${o.h2}</span></div>${e.map(([k,v,x2],i)=>{const c=o.col(k,i);
    return `<div class="row ${sel(dim,k)?"sel":hay(dim)?"dim":""}" data-f="${esc(dim)}" data-v="${esc(k)}" ${tipA(`${esc(o.lab(k,true))}<br><b>${fmt(v)}</b> casos <small>· ${pct(v,tot)}</small>`)}><span class="dot" style="background:${c};box-shadow:0 0 0 3px ${c}22"></span><span class="nm">${esc(o.lab(k))}</span><span class="br"><i style="width:${100*v/max}%;background:${c}"></i></span><span class="vl">${fmt(v)}</span><span class="v2">${o.v2(k,v,tot)}</span></div>`;}).join("")}</div>`;
}
function curva(box){
  const rows=filtra(null,true),m=agrupa(rows,"Semana"),W=box.clientWidth,H=box.clientHeight,pb=16;if(H<30||W<50)return;const _=0,n=SEMAX,bw=W/n,max=Math.max(1,...m.values());
  let s=`<svg width="${W}" height="${H}">`;
  for(let i=1;i<=n;i++){const v=m.get(String(i).padStart(2,"0"))||0,h=(H-pb-4)*v/max,on=!SEM||(i>=SEM[0]&&i<=SEM[1]);
    s+=`<g class="click" data-sem="${i}" ${tipA(`Semana ${i}<br><b>${fmt(v)}</b> casos`)}><rect x="${(i-1)*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/><rect x="${(i-1)*bw+bw*.15}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="${Math.min(3,bw*.3)}" fill="${on?"url(#gc)":"#d7dee9"}"/></g>`;
    if(i===1||(i%5===0&&n-i>2)||i===n)s+=`<text x="${(i-.5)*bw}" y="${H-3}" text-anchor="middle" font-size="9.5" fill="#8592a8">${i}</text>`;}
  box.innerHTML=s+`<defs><linearGradient id="gc" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1f63c6"/></linearGradient></defs></svg>`;
  box.querySelectorAll("[data-sem]").forEach(g=>g.onclick=()=>{const i=+g.dataset.sem;SEM=(SEM&&SEM[0]===i&&SEM[1]===i)?null:[i,i];pintar();});
}
function derecha(rows){
  const der=document.getElementById("der");der.innerHTML="";
  // eventos
  const me=agrupa(filtra("Evento").filter(r=>enCaq(val(r,UBI))),"Evento"),ev=[...me.entries()].sort((a,b)=>b[1]-a[1]);
  let box=tarjeta("eventos","lista","Eventos en el mapa",`${ev.length} eventos · clic para verlo en el mapa`);
  filasLista(box,ev,"Evento",{h1:"Evento",h2:"%",col:(k)=>(SEL.Evento===k?(MAPCOL.get(k)||"#1d4ed8"):"#1d4ed8"),lab:(k,l)=>l?`${evCod(k)} - ${evNom(k)}`:`${evCod(k)} · ${evNom(k)}`,v2:(k,v,t)=>pct(v,t)});
  // ranking municipal
  const mm=agrupa(filtra(UBI),UBI),mu=[...mm.entries()].filter(e=>enCaq(e[0])).sort((a,b)=>b[1]-a[1]);
  box=tarjeta("ranking","bandera","Municipios",UBI==="Mpio procedencia"?"procedencia · tasa ×100 mil":"residencia · tasa ×100 mil");
  filasLista(box,mu,UBI,{h1:"Municipio",h2:"Tasa",col:k=>COL_MUN[k]||"#64748b",lab:k=>capT(k),v2:(k,v)=>POB[k]?fmt1(100000*v/POB[k]):"–"});
  // curva semanal
  box=tarjeta("curva","calendario","Casos por semana epidemiológica",SEM?`SE ${SEM[0]}${SEM[1]!==SEM[0]?"–"+SEM[1]:""} · clic para cambiar`:"clic en una semana para filtrar");
  curva(box);
  der.querySelectorAll(".row[data-f]").forEach(el=>el.onclick=()=>toggle(el.dataset.f,el.dataset.v));
}

/* ---------- orquestación ---------- */
function foco(id){FOCO=FOCO===id?null:id;pintar();}
function pintar(){
  const rows=filtra(null);
  // colores de evento estables según el volumen del periodo filtrado (sin filtro de evento)
  const evs=[...agrupa(filtra("Evento").filter(r=>enCaq(val(r,UBI))),"Evento").entries()].sort((a,b)=>b[1]-a[1]).slice(0,PAL_EV.length);
  MAPCOL=new Map(evs.map(([e],i)=>[e,PAL_EV[i]]));
  const body=document.getElementById("body");body.classList.toggle("foco",!!FOCO);
  document.getElementById("centro").classList.toggle("tiene",FOCO==="mapa");document.getElementById("der").classList.toggle("tiene",!!FOCO&&FOCO!=="mapa");
  document.getElementById("mapcard").classList.toggle("focus",FOCO==="mapa");
  pintarFiltros();kpis(rows);barraMapa();derecha(rows);mapa(rows);
}

/* ---------- interacción del mapa ---------- */
let arrastre=false;
(function(){const el=document.getElementById("mapa");let p0=null,vb0=null;
  el.addEventListener("wheel",e=>{if(!svg)return;e.preventDefault();const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const u=pt.matrixTransform(svg.getScreenCTM().inverse());zoomPor(e.deltaY<0?1.25:1/1.25,u.x,u.y);},{passive:false});
  el.addEventListener("pointerdown",e=>{p0=[e.clientX,e.clientY];vb0=VB.slice();arrastre=false;});
  addEventListener("pointermove",e=>{if(!p0)return;const dx=e.clientX-p0[0],dy=e.clientY-p0[1];if(!arrastre&&Math.hypot(dx,dy)<5)return;if(!arrastre){arrastre=true;el.classList.add("drag");}
    const s=escalaPx();VB=[vb0[0]-dx/s,vb0[1]-dy/s,vb0[2],vb0[3]];aplicarVB();});
  addEventListener("pointerup",()=>{p0=null;el.classList.remove("drag");setTimeout(()=>arrastre=false,0);});
  el.addEventListener("dblclick",e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const u=pt.matrixTransform(svg.getScreenCTM().inverse());zoomPor(1.8,u.x,u.y);});
})();
document.getElementById("bfit").innerHTML=ico("objetivo");
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const g=e.target.closest&&e.target.closest("[data-tip]");if(!g||arrastre){tip.style.opacity=0;return;}tip.innerHTML=g.getAttribute("data-tip");tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+"px";});
addEventListener("keydown",e=>{if(e.key==="Escape"&&FOCO){FOCO=null;pintar();}});
let _rt;addEventListener("resize",()=>{clearTimeout(_rt);_rt=setTimeout(pintar,150);});
function botonAmpliar(){const fs=!!document.fullscreenElement;document.getElementById("ampliar").innerHTML=fs?`${ico("reducir")}<span>Salir</span>`:`${ico("ampliar")}<span>Pantalla completa</span>`;}
function nuevaPestana(){try{const u=URL.createObjectURL(new Blob(["<!DOCTYPE html>"+document.documentElement.outerHTML],{type:"text/html"}));window.open(u,"_blank");}catch(e){}}
function ampliar(){if(document.fullscreenElement){document.exitFullscreen();return;}const el=document.documentElement;if(el.requestFullscreen&&document.fullscreenEnabled!==false)el.requestFullscreen().catch(nuevaPestana);else nuevaPestana();}
document.addEventListener("fullscreenchange",()=>{botonAmpliar();setTimeout(pintar,150);});
document.getElementById("titulo").innerHTML=`${ico("mapa")}Georreferenciación de Eventos de Interés en Salud Pública${INT?' <span style="background:#e11d48;font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.05em">USO INTERNO</span>':""}`;
document.getElementById("subt").innerHTML=`Sivigila · Año <b>${AN}</b> · Datos a la <b>SE ${D.se}</b> (${D.se_fechas}) · Sujetos a depuración`;
const _ayuda=INT
 ?"<b>Versión de uso interno.</b> Ubicación real de los casos: coordenada registrada en Sivigila o, si no la tiene, la del barrio o vereda. No publicar ni enviar."
 :"<b>¿Cómo se ubican los puntos?</b><br>Cada punto es un caso, según la coordenada registrada en Sivigila o, si no la tiene, su barrio o vereda. Para proteger la identidad (Ley 1581 de 2012) el punto se desplaza al azar unos 300 m (1,5 km en eventos sensibles): muestra el foco, no la vivienda.<br><br>El resplandor indica la concentración de casos. La capa Focos agrupa los casos en celdas de ≈10 km que se afinan a 3 km y 700 m al acercar.";
document.getElementById("notag").innerHTML=`${INT?'<b style="color:#e11d48">USO INTERNO · no publicar</b><br>':""}<span class="ayuda" data-tip="${esc(_ayuda)}">ⓘ ¿Cómo se ubican los puntos?</span><br>Clic en un municipio, evento o semana para filtrar; rueda del ratón para acercar.`;
botonAmpliar();pintar();
</script>
